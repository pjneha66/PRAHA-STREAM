apply plugin: 'com.android.application'

def ksPath = System.getenv("ANDROID_KEYSTORE_PATH") ?: 'release.keystore'
// No fallback credentials. A password that lives in source is public, which
// lets anyone forge a signed update for this applicationId (audit C-03).
def ksPass = System.getenv("ANDROID_KEYSTORE_PASSWORD")
def ksAlias = System.getenv("ANDROID_KEY_ALIAS")
def ksKeyPass = System.getenv("ANDROID_KEY_PASSWORD")
def hasReleaseSigning = ksPass && ksAlias && ksKeyPass && file(ksPath).exists()

android {
    namespace = "com.praha.stream"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.praha.stream"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 13
        versionName "2.6.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(ksPath)
                storePassword ksPass
                keyAlias ksAlias
                keyPassword ksKeyPass
            }
        }
    }
    buildTypes {
        release {
            if (hasReleaseSigning) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

tasks.register('ensureReleaseKeystore') {
    doLast {
        // Auto-generating a keystore with a password committed to source is
        // worse than having no keystore at all: it produces a build that looks
        // signed but whose key is publicly known. Fail loudly instead.
        if (!ksPass || !ksAlias || !ksKeyPass) {
            throw new GradleException(
                "Release signing requires ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and " +
                "ANDROID_KEY_PASSWORD. Refusing to fall back to a publicly-known password.")
        }
        def ksFile = file(ksPath)
        if (!ksFile.exists()) {
            throw new GradleException(
                "Release keystore not found at ${ksFile.absolutePath}. Provide a real keystore " +
                "via ANDROID_KEYSTORE_PATH (and keep it out of version control).")
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // Origin-gated JS bridge (audit C-01). Resolves from the Play-updated
    // WebView; no new APK dependency bloat (Capacitor already ships it).
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    implementation project(':capacitor-android')
    implementation 'org.videolan.android:libvlc-all:3.6.2'
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

tasks.register('copyApkToDist') {
    doLast {
        def outputDir = file("${rootDir}/../dist-apk")
        outputDir.mkdirs()
        fileTree(dir: layout.buildDirectory.dir("outputs/apk"), include: '**/*.apk').each { File apk ->
            if (apk.name.contains("release")) {
                copy {
                    from apk
                    into outputDir
                    rename { "praha-stream-v${android.defaultConfig.versionName}.apk" }
                }
            } else if (apk.name.contains("debug")) {
                copy {
                    from apk
                    into outputDir
                    rename { "praha-stream-v${android.defaultConfig.versionName}-debug.apk" }
                }
            }
        }
    }
}
afterEvaluate {
    tasks.matching { it.name.contains("Release") && it.name.startsWith("validateSigning") }.configureEach {
        dependsOn('ensureReleaseKeystore')
    }
    tasks.named('assembleRelease').configure {
        dependsOn('ensureReleaseKeystore')
        finalizedBy('copyApkToDist')
    }
    tasks.named('assembleDebug').configure { finalizedBy('copyApkToDist') }
}
