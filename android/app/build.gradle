apply plugin: 'com.android.application'

def ksPath = System.getenv("ANDROID_KEYSTORE_PATH") ?: 'release.keystore'
def ksPass = System.getenv("ANDROID_KEYSTORE_PASSWORD") ?: 'prahastream'
def ksAlias = System.getenv("ANDROID_KEY_ALIAS") ?: 'prahastream'
def ksKeyPass = System.getenv("ANDROID_KEY_PASSWORD") ?: 'prahastream'

android {
    namespace = "com.praha.stream"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.praha.stream"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 2
        versionName "2.1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            storeFile file(ksPath)
            storePassword ksPass
            keyAlias ksAlias
            keyPassword ksKeyPass
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

tasks.register('ensureReleaseKeystore') {
    doLast {
        def ksFile = file(ksPath)
        if (!ksFile.exists()) {
            ksFile.parentFile.mkdirs()
            def javaHome = System.getProperty("java.home")
            def keytoolBin = file("${javaHome}/bin/keytool").exists() ? "${javaHome}/bin/keytool" : "keytool"
            def pb = new ProcessBuilder(
                keytoolBin, '-genkeypair', '-v',
                '-keystore', ksFile.absolutePath,
                '-alias', ksAlias,
                '-keyalg', 'RSA',
                '-keysize', '2048',
                '-validity', '10000',
                '-storepass', ksPass,
                '-keypass', ksKeyPass,
                '-dname', 'CN=PRAHA STREAM, OU=Android, O=PRAHA, L=Mumbai, S=MH, C=IN'
            )
            pb.inheritIO()
            def proc = pb.start()
            if (proc.waitFor() != 0) {
                throw new GradleException("Failed to generate release keystore")
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

tasks.register('copyApkToDist') {
    doLast {
        def outputDir = file("${rootDir}/../dist-apk")
        outputDir.mkdirs()
        fileTree(dir: layout.buildDirectory.dir("outputs/apk"), include: '**/*.apk').each { File apk ->
            if (apk.name.contains("release")) {
                copy {
                    from apk
                    into outputDir
                    rename { "praha-stream-v${android.defaultConfig.versionName}.apk" }
                }
            } else if (apk.name.contains("debug")) {
                copy {
                    from apk
                    into outputDir
                    rename { "praha-stream-v${android.defaultConfig.versionName}-debug.apk" }
                }
            }
        }
    }
}
afterEvaluate {
    tasks.matching { it.name.contains("Release") && it.name.startsWith("validateSigning") }.configureEach {
        dependsOn('ensureReleaseKeystore')
    }
    tasks.named('assembleRelease').configure {
        dependsOn('ensureReleaseKeystore')
        finalizedBy('copyApkToDist')
    }
    tasks.named('assembleDebug').configure { finalizedBy('copyApkToDist') }
}
