<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' blob:; img-src 'self' data: blob:; font-src 'self' data: blob:; frame-src 'self' blob:; connect-src 'self' blob: data:; form-action 'none'; base-uri 'self'">
    <title>Book reader</title>
  </head>
  <body>
    <main id="pages" aria-label="Book pages"></main>
    <nav aria-label="Reading controls">
      <div class="reader-navigation">
        <button id="previous" disabled>Previous</button>
        <span id="position" role="status">Opening book…</span>
        <button id="next" disabled>Next</button>
      </div>
      <div id="zoom-controls" class="reader-zoom" role="group" aria-label="Page zoom" hidden>
        <button id="zoom-out" aria-label="Zoom out" disabled>−</button>
        <button id="zoom-reset" aria-label="Reset zoom to fit" disabled>100%</button>
        <button id="zoom-in" aria-label="Zoom in">+</button>
      </div>
    </nav>
    <script type="module" src="/src/book-reader/reader.ts"></script>
  </body>
</html>
