name: Android Build & GitHub Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release Android APK
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Prepare release signing keystore
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error::Release signing secrets are missing. Refusing to publish a debug-signed APK."
            echo "A debug key is generated from a publicly-known password, so an APK signed with it can be"
            echo "forged by anyone. Configure ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,"
            echo "ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD before tagging a release."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/praha-signing"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/praha-signing/release.keystore"
          echo "ANDROID_SIGNING_AVAILABLE=true" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/praha-signing/release.keystore" >> "$GITHUB_ENV"
          ls -l "$RUNNER_TEMP/praha-signing/release.keystore"

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/praha-signing/release.keystore

      - name: Verify Generated APK
        run: |
          ls -lh dist-apk/
          test -n "$(ls dist-apk/praha-stream-v*.apk 2>/dev/null)"

      # Proves the release APKs carry the real release key. A debug key would
      # still install, so this is the only thing standing between a missing
      # secret and publishing a forgeable build.
      - name: Assert APKs are release-signed
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          for apk in dist-apk/praha-stream-v*.apk; do
            certs=$("$APKSIGNER" verify --print-certs "$apk" 2>&1)
            if ! printf '%s' "$certs" | grep -q "V2 Signer"; then
              echo "::error::$apk is not V2-signed."
              exit 1
            fi
            if printf '%s' "$certs" | grep -qi "CN=Android Debug"; then
              echo "::error::$apk is signed with the debug key."
              exit 1
            fi
            printf '%s\n' "$certs" | grep -E "certificate (DN|SHA-256)"
          done

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: praha-stream-android-apk
          path: dist-apk/*.apk
          retention-days: 30

      # Tag pushes only. A manual dispatch builds and uploads the artifact for
      # inspection but must not publish, or `github.ref_name` would be a branch
      # name and the old v2.11.13 fallback could rewrite a shipped release.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          tag_name: ${{ github.ref_name }}
          name: PRAHA STREAM ${{ github.ref_name }}
          files: dist-apk/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
